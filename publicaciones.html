<!doctype html><html lang="gl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicacións · CECVi</title><style>body{margin:0;background:#f5f5f5;color:#171717;font:16px system-ui}.wrap{max-width:1150px;margin:auto;padding:0 20px}header{background:#fff}nav{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:15px 0}nav a{color:#111;text-decoration:none;font-weight:700;font-size:.9rem}nav a:hover{text-decoration:underline}.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand img{background:#111;width:88px;height:65px;object-fit:contain}.hero{background:#171717;color:#fff;padding:66px 0}.hero h1{font-size:clamp(2.8rem,6vw,4.6rem);margin:5px 0}.main{padding:65px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}.news{background:#fff;border:1px solid #ddd}.news img{width:100%;height:230px;object-fit:cover;display:block}.news .copy{padding:24px}.news time{font-size:.8rem;color:#666}.news h2{font-size:1.4rem}.news p{white-space:pre-line;line-height:1.65;color:#555}footer{padding:35px;background:#eee}#access{position:fixed;inset:0;background:#090909;color:#fff;z-index:10;display:grid;place-items:center}#access[hidden]{display:none}#access form{text-align:center;padding:20px}#access img{width:200px;height:125px;object-fit:contain}#access input,#access button{padding:12px}@media(max-width:700px){nav{gap:12px}.brand{width:100%}.main{padding:40px 0}}</style></head><body><div id="access"><form id="gate"><img src="assets/logo2.png" alt="CECVi"><h2>Acceso de probas</h2><input id="password" type="password" placeholder="Código de acceso" required><button>Entrar</button><p id="error"></p></form></div><header><nav class="wrap"><a class="brand" href="index.html"><img src="assets/logo2.png" alt="CECVi"><strong>CECVi</strong></a><a href="index.html">Inicio</a><a href="club.html">O club</a><a href="escola.html">A escola</a><a href="agenda.html">Axenda</a><a href="publicaciones.html">Publicacións</a><a href="normativa.html">Normativa</a><a href="contacto.html">Contacto</a><a href="admin/">Admin</a></nav></header><section class="hero"><div class="wrap"><p>ACTUALIDADE DO CLUB</p><h1>Publicacións</h1><p>Novidades, competicións e fotografías do CECVi.</p></div></section><main class="main"><div class="wrap"><div class="grid" id="posts">Cargando publicacións…</div></div></main><footer><div class="wrap">CECVi · Clube de Esgrima Cidade de Vigo · Bouzas</div></footer><script>
const gate=document.querySelector('#access');if(sessionStorage.getItem('cecvi-access')==='ok')gate.hidden=true;document.querySelector('#gate').onsubmit=e=>{e.preventDefault();if(document.querySelector('#password').value==='pinto'){sessionStorage.setItem('cecvi-access','ok');gate.hidden=true}else document.querySelector('#error').textContent='Código incorrecto'};
(async()=>{const box=document.querySelector('#posts');try{const r=await fetch('content/publicaciones.json',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();const items=(d.publicaciones||[]).slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));box.replaceChildren();if(!items.length){box.textContent='Aínda non hai publicacións.';return}for(const item of items){const article=document.createElement('article');article.className='news';if(item.imagen){const img=document.createElement('img');img.alt=item.titulo||'Fotografía CECVi';img.loading='lazy';img.src=item.imagen.startsWith('/')?item.imagen.slice(1):item.imagen;article.append(img)}const copy=document.createElement('div');copy.className='copy';const time=document.createElement('time');time.textContent=item.fecha||'';const title=document.createElement('h2');title.textContent=item.titulo||'';const p=document.createElement('p');p.textContent=item.texto||'';copy.append(time,title,p);article.append(copy);box.append(article)}}catch{box.textContent='Non foi posible cargar as publicacións.'}})();</script></body></html>
